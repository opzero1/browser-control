<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { background: radial-gradient(120% 140% at 0% 0%, #1b2a3f 0%, #111827 55%, #0b111c 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; color: #f8fafc; }
  .top { display: flex; align-items: center; gap: 18px; padding: 52px 34px 0; }
  .top img { width: 84px; height: 84px; }
  h1 { margin: 0; font-size: 33px; line-height: 1.05; letter-spacing: -0.5px; }
  p { margin: 8px 0 0; font-size: 15.5px; line-height: 1.35; color: #b6c2d1; }
  .strip { position: absolute; left: 36px; bottom: 44px; }
  .strip img { display: block; border-radius: 6px; box-shadow: 0 0 0 1px #2c3a4f; }
</style>
</head>
<body>
  <div class="top">
    <img src="icon.png" alt="">
    <div>
      <h1>Browser Control</h1>
      <p>Connects your browser tabs to a local AI agent on your computer.</p>
    </div>
  </div>
  <div class="strip"><img src="strip.png" alt=""></div>
</body>
</html>

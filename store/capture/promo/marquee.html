<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
  body { position: relative; background: radial-gradient(110% 150% at 0% 0%, #1b2a3f 0%, #111827 55%, #0b111c 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; color: #f8fafc; }
  .text { position: absolute; left: 72px; top: 78px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 104px; height: 104px; }
  h1 { margin: 0; font-size: 54px; letter-spacing: -1px; line-height: 1; }
  .tagline { margin: 28px 0 26px; font-size: 23px; line-height: 1.4; color: #c5d0dd; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { position: relative; padding: 7px 0 7px 30px; font-size: 19px; color: #e2e8f0; }
  li::before { content: ""; position: absolute; left: 2px; top: 15px; width: 12px; height: 12px; border-radius: 50%; border: 3px solid #15c58f; }
  .shot { position: absolute; right: 0; bottom: 0; width: 720px; height: 480px; border-top-left-radius: 16px; overflow: hidden;
    box-shadow: 0 0 0 1px #2c3a4f, -24px -12px 60px rgba(0, 0, 0, .45); }
  .shot img { display: block; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="icon.png" alt=""><h1>Browser Control</h1></div>
    <p class="tagline">Connects your browser tabs to a local AI agent through a native host that you install.</p>
    <ul>
      <li>Opens and groups the agent's own tabs</li>
      <li>Reads pages, clicks buttons and fills forms</li>
      <li>Leaves finished work in a ✅ tab group</li>
    </ul>
  </div>
  <div class="shot"><img src="shot.png" alt=""></div>
</body>
</html>

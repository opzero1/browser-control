name: Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag or branch to build, for example vX.Y.Z"
        required: true
        type: string
      action:
        description: "status reads the item state; upload replaces the draft package; submit uploads and submits for review; cancel cancels the pending review"
        required: true
        default: status
        type: choice
        options:
          - status
          - upload
          - submit
          - cancel

run-name: Chrome Web Store ${{ inputs.action }} ${{ inputs.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
        if: ${{ inputs.action == 'upload' || inputs.action == 'submit' }}
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        if: ${{ inputs.action == 'upload' || inputs.action == 'submit' }}
        with:
          node-version: 22
          cache: pnpm

      - if: ${{ inputs.action == 'upload' || inputs.action == 'submit' }}
        run: pnpm install --frozen-lockfile

      - if: ${{ inputs.action == 'upload' || inputs.action == 'submit' }}
        run: pnpm run check

      - name: Get Chrome Web Store access token
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      - name: Fetch item status
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_PUBLISHER_ID}/items/${EXTENSION_ID}:fetchStatus")"
          status="$(printf '%s' "$response" | tail -n 1)"
          body="$(printf '%s' "$response" | sed '$d')"
          printf 'Chrome Web Store status returned HTTP %s:\n%s\n' "$status" "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

      - name: Upload extension package
        if: ${{ inputs.action == 'upload' || inputs.action == 'submit' }}
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -T dist/release/browser-control-extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CHROME_PUBLISHER_ID}/items/${EXTENSION_ID}:upload")"
          status="$(printf '%s' "$response" | tail -n 1)"
          body="$(printf '%s' "$response" | sed '$d')"
          printf 'Chrome Web Store upload returned HTTP %s:\n%s\n' "$status" "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

      - name: Submit for review
        if: ${{ inputs.action == 'submit' }}
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_PUBLISHER_ID}/items/${EXTENSION_ID}:publish")"
          status="$(printf '%s' "$response" | tail -n 1)"
          body="$(printf '%s' "$response" | sed '$d')"
          printf 'Chrome Web Store publish returned HTTP %s:\n%s\n' "$status" "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

      - name: Cancel pending review
        if: ${{ inputs.action == 'cancel' }}
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_PUBLISHER_ID}/items/${EXTENSION_ID}:cancelSubmission")"
          status="$(printf '%s' "$response" | tail -n 1)"
          body="$(printf '%s' "$response" | sed '$d')"
          printf 'Chrome Web Store cancelSubmission returned HTTP %s:\n%s\n' "$status" "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
